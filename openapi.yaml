openapi: "3.0.3"
info:
  title: Saukele Wedding Registry API
  version: "1.0.0"
  description: REST API for Saukele wedding registry platform

servers:
  - url: http://localhost:3000/api

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [COUPLE, GUEST, ADMIN] }

    Registry:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        eventDate: { type: string, format: date }
        description: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, CLOSED] }
        shareToken: { type: string }
        gifts: { type: array, items: { $ref: '#/components/schemas/Gift' } }

    Gift:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        priceKzt: { type: number }
        category: { type: string }
        giftType: { type: string, enum: [SINGLE, POOL] }
        status: { type: string, enum: [AVAILABLE, RESERVED, PURCHASED, DELIVERED] }
        totalFunded: { type: number }

    Contribution:
      type: object
      properties:
        id: { type: integer }
        giftId: { type: integer }
        amountKzt: { type: number }
        amountOriginal: { type: number }
        originalCurrency: { type: string }
        exchangeRateAtTime: { type: number }
        lockedAt: { type: string, format: date-time }
        status: { type: string, enum: [PENDING, FUNDED, REFUNDED] }

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email: { type: string, format: email, example: "asel@example.com" }
                name: { type: string, example: "Asel Nurova" }
                password: { type: string, minLength: 8, example: "correct-horse-battery" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "400": { description: Missing fields, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "409": { description: Email already exists, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/login:
    post:
      summary: Login and receive JWT tokens
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: "asel@example.com" }
                password: { type: string, example: "correct-horse-battery" }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
        "401": { description: Invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "429": { description: Too many attempts, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
        "401": { description: Invalid or expired refresh token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /registries:
    post:
      summary: Create a new registry (Couple only)
      tags: [Registries]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, eventDate]
              properties:
                title: { type: string, example: "Asel & Daniyar Wedding" }
                eventDate: { type: string, format: date, example: "2025-08-15" }
                description: { type: string }
      responses:
        "201":
          description: Registry created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registry' }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

    get:
      summary: List own registries (paginated)
      tags: [Registries]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
        - in: query
          name: status
          schema: { type: string, enum: [DRAFT, PUBLISHED, CLOSED] }
      responses:
        "200":
          description: List of registries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Registry' } }
                  total: { type: integer }
                  page: { type: integer }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /registries/{id}/publish:
    patch:
      summary: Publish a registry (Couple only)
      tags: [Registries]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Registry published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registry' }
        "400": { description: Registry has no gifts, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "404": { description: Registry not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /registries/share/{token}:
    get:
      summary: Get a public registry by share token (no auth required)
      tags: [Registries]
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Registry details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registry' }
        "404": { description: Registry not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /gifts:
    post:
      summary: Add a gift to a registry (Couple only)
      tags: [Gifts]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registryId, title, priceKzt, giftType]
              properties:
                registryId: { type: integer }
                title: { type: string, example: "KitchenAid Mixer" }
                description: { type: string }
                imageUrl: { type: string, format: uri }
                priceKzt: { type: number, example: 120000 }
                category: { type: string, example: "Home" }
                giftType: { type: string, enum: [SINGLE, POOL] }
      responses:
        "201":
          description: Gift created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gift' }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "403": { description: Forbidden (not owner), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "404": { description: Registry not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /gifts/{id}/reserve:
    patch:
      summary: Reserve a single gift (Guest)
      tags: [Gifts]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Gift reserved for 48 hours
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gift' }
        "400": { description: Gift is not SINGLE type, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "404": { description: Gift not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "409": { description: Gift already reserved, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "422": { description: Gift is already purchased, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /contributions:
    post:
      summary: Contribute to a pool gift (Guest)
      tags: [Contributions]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [giftId, amountKzt]
              properties:
                giftId: { type: integer }
                amountKzt: { type: number, example: 5000 }
                originalCurrency: { type: string, example: "EUR" }
                amountOriginal: { type: number, example: 10.5 }
      responses:
        "201":
          description: Contribution created (status PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contribution' }
        "400": { description: Amount must be > 0 or gift is not POOL type, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "404": { description: Gift not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "409": { description: Gift already fully funded, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /contributions/webhook/payment:
    post:
      summary: Pay webhook — confirms a payment
      tags: [Contributions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentRef: { type: string }
                status: { type: string, enum: [SUCCESS, FAILED] }
      responses:
        "200": { description: Webhook processed }
        "400": { description: Invalid signature, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "404": { description: Contribution not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /kinship:
    post:
      summary: Set kinship relationship to a couple (Guest)
      tags: [Kinship]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coupleId, kinshipType]
              properties:
                coupleId: { type: integer }
                kinshipType: { type: string, enum: [ATA_ANA, TUYS, ZHIEN_ZHARAN, DOSY] }
      responses:
        "201":
          description: Kinship relation saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  kinshipType: { type: string }
                  tier: { type: integer }
                  suggestedContributionKzt: { type: number }
        "400": { description: Invalid kinship type, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "409": { description: Relation already exists, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/users:
    get:
      summary: List all users (Admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: sort
          schema: { type: string, example: "-createdAt" }
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/User' } }
                  total: { type: integer }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "403": { description: Admin access required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
