openapi: "3.0.3"
info:
  title: Saukele Wedding Registry API
  version: "1.0.0"
  description: REST API for Saukele wedding registry platform

servers:
  - url: http://localhost:3000/api

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [COUPLE, GUEST, ADMIN] }

    Registry:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        eventDate: { type: string, format: date }
        description: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, CLOSED] }
        shareToken: { type: string }
        gifts: { type: array, items: { $ref: '#/components/schemas/Gift' } }

    Gift:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        priceKzt: { type: number }
        category: { type: string }
        giftType: { type: string, enum: [SINGLE, POOL] }
        status: { type: string, enum: [AVAILABLE, RESERVED, PURCHASED, DELIVERED] }
        isPrivate: { type: boolean }
        totalFunded: { type: number }

    Contribution:
      type: object
      properties:
        id: { type: integer }
        giftId: { type: integer }
        amountKzt: { type: number }
        amountOriginal: { type: number }
        originalCurrency: { type: string }
        exchangeRateAtTime: { type: number }
        lockedAt: { type: string, format: date-time }
        status: { type: string, enum: [PENDING, FUNDED, REFUNDED] }

    Notification:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        message: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    LogisticsOrder:
      type: object
      properties:
        id: { type: integer }
        giftId: { type: integer }
        registryId: { type: integer }
        courierProvider: { type: string }
        status: { type: string }
        isFragile: { type: boolean }
        whiteGlove: { type: boolean }
        pickupAddress: { type: string }
        deliveryAddress: { type: string }
        estimatedAt: { type: string, format: date-time }

paths:

  # ─── AUTH ───────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email: { type: string, format: email, example: "asel@example.com" }
                name: { type: string, example: "Asel Nurova" }
                password: { type: string, minLength: 8, example: "Password123" }
                role: { type: string, enum: [COUPLE, GUEST], default: GUEST }
      responses:
        "201":
          description: User created — verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Registration successful. Please check your email to verify your account." }
        "409": { description: Email already exists, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/verify-email:
    get:
      summary: Verify email with token from email link
      tags: [Auth]
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
          example: "099a3efd095293f6e18333ac53ac9af8d36ba1ed6ab5da3725afa82f2a8e874c"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Email verified successfully. You can now log in." }
        "400": { description: Invalid or expired token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/login:
    post:
      summary: Login and receive JWT tokens
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: "asel@example.com" }
                password: { type: string, example: "Password123" }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
        "401": { description: Invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "403": { description: Email not verified or user suspended, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "429": { description: Too many attempts, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/refresh:
    post:
      summary: Refresh access token (rotation)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
        "401": { description: Invalid or expired refresh token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/logout:
    post:
      summary: Logout and invalidate refresh token
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        "204": { description: Logged out successfully }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/forgot-password:
    post:
      summary: Request password reset email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: "asel@example.com" }
      responses:
        "200":
          description: Reset link sent if email exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "If this email exists, a reset link has been sent." }

  /auth/reset-password:
    post:
      summary: Reset password using token from email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8, example: "NewPassword123" }
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Password reset successful. Please log in with your new password." }
        "400": { description: Invalid or expired token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ─── REGISTRIES ─────────────────────────────────────────────────────────────

  /registries:
    post:
      summary: Create a new registry (Couple only)
      tags: [Registries]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, eventDate]
              properties:
                title: { type: string, example: "Asel & Daniyar Wedding" }
                eventDate: { type: string, format: date, example: "2025-08-15" }
                description: { type: string }
      responses:
        "201":
          description: Registry created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registry' }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "403": { description: Couple role required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

    get:
      summary: List own registries (paginated)
      tags: [Registries]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
        - in: query
          name: status
          schema: { type: string, enum: [DRAFT, PUBLISHED, CLOSED] }
      responses:
        "200":
          description: List of registries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Registry' } }
                  total: { type: integer }
                  page: { type: integer }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /registries/{id}/publish:
    patch:
      summary: Publish a registry (Couple only)
      tags: [Registries]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Registry published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registry' }
        "400": { description: Registry has no gifts, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "404": { description: Registry not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /registries/share/{token}:
    get:
      summary: Get a public registry by share token (no auth required)
      tags: [Registries]
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Registry details (public gifts only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registry' }
        "404": { description: Registry not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ─── GIFTS ──────────────────────────────────────────────────────────────────

  /gifts:
    post:
      summary: Add a gift to a registry (Couple only)
      tags: [Gifts]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registryId, title, priceKzt, giftType]
              properties:
                registryId: { type: integer }
                title: { type: string, example: "KitchenAid Mixer" }
                description: { type: string }
                priceKzt: { type: number, example: 120000 }
                category: { type: string, example: "Home" }
                giftType: { type: string, enum: [SINGLE, POOL] }
                isPrivate: { type: boolean, default: false }
      responses:
        "201":
          description: Gift created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gift' }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "404": { description: Registry not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /gifts/{id}:
    get:
      summary: Get gift details with funding progress
      tags: [Gifts]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Gift details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gift' }
        "403": { description: Private gift — tier access required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "404": { description: Gift not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

    patch:
      summary: Update a gift (Couple only)
      tags: [Gifts]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                priceKzt: { type: number }
                category: { type: string }
                isPrivate: { type: boolean }
      responses:
        "200":
          description: Gift updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gift' }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "404": { description: Gift not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

    delete:
      summary: Delete a gift (Couple only)
      tags: [Gifts]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Gift deleted }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "404": { description: Gift not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /gifts/{id}/reserve:
    patch:
      summary: Reserve a SINGLE gift (Guest)
      tags: [Gifts]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Gift reserved for 48 hours
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gift' }
        "400": { description: Gift is not SINGLE type, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "409": { description: Gift already reserved, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "422": { description: Gift already purchased, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ─── CONTRIBUTIONS ──────────────────────────────────────────────────────────

  /contributions:
    post:
      summary: Contribute to a POOL gift (Guest)
      tags: [Contributions]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [giftId, amountKzt]
              properties:
                giftId: { type: integer }
                amountKzt: { type: number, example: 5000 }
                originalCurrency: { type: string, example: "EUR" }
                amountOriginal: { type: number, example: 10.5 }
      responses:
        "201":
          description: Contribution created (status PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contribution' }
        "400": { description: Amount must be > 0 or gift is not POOL type, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "409": { description: Gift already fully funded, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /contributions/webhook/payment:
    post:
      summary: Payment webhook — confirms or fails a payment
      tags: [Contributions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentRef: { type: string }
                status: { type: string, enum: [SUCCESS, FAILED] }
      responses:
        "200": { description: Webhook processed }
        "400": { description: Invalid signature, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "404": { description: Contribution not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ─── KINSHIP ────────────────────────────────────────────────────────────────

  /kinship:
    post:
      summary: Set kinship relationship to a couple (Guest)
      tags: [Kinship]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coupleId, kinshipType]
              properties:
                coupleId: { type: integer }
                kinshipType: { type: string, enum: [ATA_ANA, TUYS, ZHIEN_ZHARAN, DOSY] }
      responses:
        "201":
          description: Kinship relation saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  kinshipType: { type: string }
                  tier: { type: integer }
                  suggestedContributionKzt: { type: number }
        "409": { description: Relation already exists, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /kinship/{coupleId}:
    get:
      summary: Get kinship relation and suggested contribution amount
      tags: [Kinship]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: coupleId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Kinship info
          content:
            application/json:
              schema:
                type: object
                properties:
                  kinshipType: { type: string }
                  tier: { type: integer }
                  suggestedContributionKzt: { type: number }
        "404": { description: Relation not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

    put:
      summary: Update kinship type
      tags: [Kinship]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: coupleId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kinshipType]
              properties:
                kinshipType: { type: string, enum: [ATA_ANA, TUYS, ZHIEN_ZHARAN, DOSY] }
      responses:
        "200":
          description: Kinship updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  kinshipType: { type: string }
                  tier: { type: integer }
                  suggestedContributionKzt: { type: number }
        "404": { description: Relation not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /kinship/{coupleId}/tree:
    get:
      summary: Get recursive family tree for a couple
      tags: [Kinship]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: coupleId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Family tree
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    userId: { type: integer }
                    name: { type: string }
                    kinshipType: { type: string }
                    tier: { type: integer }
        "404": { description: Couple not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ─── LOGISTICS ──────────────────────────────────────────────────────────────

  /logistics/providers:
    get:
      summary: Get available courier providers
      tags: [Logistics]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of providers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    supportsWhiteGlove: { type: boolean }
                    baseRateKzt: { type: number }

  /logistics:
    post:
      summary: Dispatch courier for a gift
      tags: [Logistics]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [giftId, registryId, courierProvider, pickupAddress, deliveryAddress]
              properties:
                giftId: { type: integer }
                registryId: { type: integer }
                courierProvider: { type: string, example: "CHOCO" }
                isFragile: { type: boolean, default: false }
                whiteGlove: { type: boolean, default: false }
                pickupAddress: { type: string }
                deliveryAddress: { type: string }
      responses:
        "201":
          description: Logistics order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsOrder' }
        "400": { description: Fragile gift requires white glove, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /logistics/registry/{registryId}:
    get:
      summary: List all logistics orders for a registry
      tags: [Logistics]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: registryId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LogisticsOrder' }

  /logistics/{id}/status:
    patch:
      summary: Update logistics order status
      tags: [Logistics]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, example: "IN_TRANSIT" }
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsOrder' }
        "404": { description: Order not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ─── NOTIFICATIONS ──────────────────────────────────────────────────────────

  /notifications:
    get:
      summary: Get notifications for current user
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  total: { type: integer }

  /notifications/etiquette:
    get:
      summary: Check Kuttykau etiquette period for current user
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Etiquette info
          content:
            application/json:
              schema:
                type: object
                properties:
                  inKuttykauPeriod: { type: boolean }
                  message: { type: string }

  /notifications/read-all:
    patch:
      summary: Mark all notifications as read
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: All marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }

  # ─── ADMIN ──────────────────────────────────────────────────────────────────

  /admin/users:
    get:
      summary: List all users (Admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: sort
          schema: { type: string, example: "-createdAt" }
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/User' } }
                  total: { type: integer }
        "403": { description: Admin access required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/users/{id}:
    get:
      summary: Get user by ID (Admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "404": { description: User not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

    delete:
      summary: Delete user (Admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
