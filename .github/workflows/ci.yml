name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - name: Run unit tests (no DB needed)
        run: npx jest tests/unit --runInBand
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          JWT_SECRET: ci-unit-test-jwt-secret-must-be-at-least-64-characters-0000001
          REFRESH_SECRET: ci-unit-test-refresh-secret-must-be-at-least-64-characters-00002
          PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
          NODE_ENV: test
          FRONTEND_URL: http://localhost:5173

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: saukele
          POSTGRES_PASSWORD: saukele_password
          POSTGRES_DB: saukele_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run migrations on test DB
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://saukele:saukele_password@localhost:5432/saukele_test?schema=public
      - name: Run integration tests
        run: npx jest tests/integration --runInBand --forceExit
        env:
          DATABASE_URL: postgresql://saukele:saukele_password@localhost:5432/saukele_test?schema=public
          JWT_SECRET: ci-integration-jwt-secret-must-be-at-least-64-characters-000001
          REFRESH_SECRET: ci-integration-refresh-secret-must-be-at-least-64-chars-000002
          PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
          NODE_ENV: test
          FRONTEND_URL: http://localhost:5173

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
